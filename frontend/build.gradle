plugins {
    /// Plugin to handle NodeJS
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

configurations {
    frontendFiles {
        canBeConsumed = true
        canBeResolved = false
    }
}

/** If the flag -DincludeConfig is passed, we include it */
def includeConfig = project.hasProperty('includeConfig')

node {
    version = '22.12.0'
    download = true
    workDir = file("${project.projectDir}/.gradle/nodejs")
    yarnWorkDir = file("${project.projectDir}/.gradle/yarn")
    nodeProjectDir = file("${project.projectDir}")
}

def distDir = layout.buildDirectory.dir("dist")

def buildFrontend = tasks.register('buildFrontend', YarnTask) {
    outputs.upToDateWhen {
        return distDir.get().asFile.isDirectory()
    }
    args = ['run', 'pbuild']
    dependsOn tasks.named('yarn')
    dependsOn rootProject.tasks.named('openApiGenerate')
}

def packageFrontend = tasks.register('packageFrontend', Zip) {
    outputs.upToDateWhen {
        return layout.buildDirectory.file("lib/dres-frontend.jar").get().asFile.exists()
    }
    dependsOn buildFrontend
    archiveBaseName = 'dres-frontend'
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir("lib")
    from(distDir.map { it.dir("browser") }) {
        if (!includeConfig) {
            exclude '**/config.json'
        }
        into 'html'
    }
}

artifacts {
    frontendFiles(packageFrontend) {
        type = "jar"
    }
}
