import org.apache.tools.ant.taskdefs.condition.Os
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-stdlib:$version_kotlin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$version_kotlin"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$version_kotlin"
    }
}

apply plugin: 'application'
apply plugin: 'kotlin'
apply plugin: 'kotlinx-serialization'
apply plugin: 'kotlin-kapt'
apply plugin: 'idea'

application {
    mainClass = 'dev.dres.DRES'
}

/* Bytecode targets Java 17, so DRES runs on any JVM >= 17 (e.g., 21). It can be built with JDK 17 or newer. */
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

/* Configuration for frontend classpath files (see dependencies). */
configurations {
    frontendClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.reposilite.com/snapshots'
        allowInsecureProtocol = true
    } //javalin openapi snapshot
}


dependencies {

    ///// Frontend files (produced by sub-project).
    implementation frontendClasspath(project(path: ":frontend", configuration: 'frontendFiles'))

    ///// FFMpeg dependency
    implementation files(layout.buildDirectory.dir("ext")) {builtBy 'setupFFMpeg'}

    ///// Xodus & Xodus DNQ
    implementation "org.jetbrains.xodus:xodus-openAPI:${version_xodus}"
    implementation "org.jetbrains.xodus:xodus-environment:${version_xodus}"
    implementation "org.jetbrains.xodus:xodus-entity-store:${version_xodus}"
    implementation "org.jetbrains.xodus:xodus-vfs:${version_xodus}"
    implementation "org.jetbrains.xodus:dnq:${version_xodus_dnq}"

    ////// Javalin
    implementation "io.javalin:javalin:${version_javalin}"
    kapt("io.javalin.community.openapi:openapi-annotation-processor:$version_javalinopenapi")

    implementation "io.javalin.community.openapi:javalin-openapi-plugin:${version_javalinopenapi}"
    implementation "io.javalin.community.openapi:javalin-swagger-plugin:${version_javalinopenapi}"
    implementation "io.javalin.community.ssl:ssl-plugin:${version_javalinssl}"

    ////// Bcrypt
    implementation "org.mindrot:jbcrypt:${version_bcrypt}"

    ////// JLine 3, Clikt & Picnic for optimal terminal experience :-)
    implementation "org.jline:jline-terminal:${version_jline3}"
    implementation "org.jline:jline-terminal-jna:${version_jline3}"
    implementation "org.jline:jline-reader:${version_jline3}"
    implementation "org.jline:jline-builtins:${version_jline3}"
    implementation "com.github.ajalt.clikt:clikt:${version_clikt}"
    implementation "com.jakewharton.picnic:picnic:${version_picnic}"

    ///// Fuel
    implementation "com.github.kittinunf.fuel:fuel:${version_fuel}"

    ////// CSV
    implementation "com.github.doyaaaaaken:kotlin-csv-jvm:${version_kotlin_csv}"

    ////// Jaffree ffmpeg wrapper
    implementation "com.github.kokorin.jaffree:jaffree:${version_jaffree}"

    ////// Log4J
    implementation "org.apache.logging.log4j:log4j-api:${version_log4j}"
    implementation "org.apache.logging.log4j:log4j-core:${version_log4j}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${version_log4j}"
    implementation "org.apache.logging.log4j:log4j-jul:${version_log4j}"

    ////// FastUtil
    implementation "it.unimi.dsi:fastutil:${version_fastutil}"

    ///// JUnit 5 (Gradle 9 requires the platform launcher on the test runtime classpath)
    testImplementation platform("org.junit:junit-bom:${version_junit}")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testImplementation "org.junit.jupiter:junit-jupiter:${version_junit}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${version_junit}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${version_junit}"

    ///// Jackson / Kotlin
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:${version_jackson_kotlin}"

    ///// Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${version_kotlin}"
    implementation "org.jetbrains.kotlin:kotlin-reflect:${version_kotlin}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${version_kotlinx_serialization}"
}

kapt {
    correctErrorTypes = true
    useBuildCache = true
}


test {
    useJUnitPlatform()
    testLogging {
        events = ["failed"]
        exceptionFormat = "full"
    }
}

idea {
    module {
        downloadJavadoc = true
    }
}

sourceSets {
    main {
        resources {
            srcDir 'config'
        }
    }
}

distributions {
    main {
        distributionBaseName = 'dres-dist'
    }
}

/** Custom tasks: FFmpeg Download and deployment. */

def ffOs = {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return "win"
    } else if (Os.isFamily(Os.FAMILY_MAC)) {
        return "osx"
    } else if (Os.isFamily(Os.FAMILY_UNIX)) {
        return "linux"
    }
    return ""
}()
def ffmpegZip = layout.buildDirectory.file("cache/ffmpeg.zip")
def ffprobeZip = layout.buildDirectory.file("cache/ffprobe.zip")
def ffmpegDir = layout.buildDirectory.dir("ext/ffmpeg")

def downloadFFmpeg = tasks.register('downloadFFmpeg', de.undercouch.gradle.tasks.download.Download) {
    src "https://github.com/vot/ffbinaries-prebuilt/releases/download/v4.4.1/ffmpeg-4.4.1-$ffOs-64.zip"
    dest ffmpegZip
    overwrite false
}

def downloadFFprobe = tasks.register('downloadFFprobe', de.undercouch.gradle.tasks.download.Download) {
    src "https://github.com/vot/ffbinaries-prebuilt/releases/download/v4.4.1/ffprobe-4.4.1-$ffOs-64.zip"
    dest ffprobeZip
    overwrite false
}

def copyFFmpeg = tasks.register('copyFFmpeg', Copy) {
    dependsOn downloadFFmpeg
    from { zipTree(ffmpegZip) }
    into ffmpegDir
    include '*ffmpeg*'
    filePermissions { unix("rwxr-xr-x") }
}

def copyFFprobe = tasks.register('copyFFprobe', Copy) {
    dependsOn downloadFFprobe
    from { zipTree(ffprobeZip) }
    into ffmpegDir
    include '*ffprobe*'
    filePermissions { unix("rwxr-xr-x") }
}

/* Gradle 9 normalises file permissions in archives; keep them so that the bundled FFmpeg binaries stay executable. */
tasks.withType(AbstractArchiveTask).configureEach {
    if (it.name.startsWith('dist')) {
        useFileSystemPermissions()
    }
}

tasks.register('setupFFMpeg') {
    dependsOn copyFFmpeg
    dependsOn copyFFprobe
}

tasks.named('startScripts') {
    doLast {
        windowsScript.text = windowsScript.text.replaceAll('set CLASSPATH=.*', 'set CLASSPATH=.;%APP_HOME%/lib/*')
    }
}

/* Exclude logback-classic. 8. July 2024: Leak comes from openapi-annotation */
configurations.configureEach {
    exclude module: "logback-classic"
}
